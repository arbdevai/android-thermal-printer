name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'worktree-**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || echo "Release build completed or skipped"

      - name: Upload ARBCN User App Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbcn-v1.5.0-user-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload ARBCN User App Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arbcn-v1.5.0-user-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload ARBCN Admin Generator Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbcn-admin-generator-debug-apk
          path: admin-generator/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload ARBCN Admin Generator Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arbcn-admin-generator-release-apk
          path: admin-generator/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
